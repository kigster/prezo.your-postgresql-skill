<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What belongs in your PostgreSQL skills file</title>

    <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="node_modules/reveal.js/dist/theme/black.css" id="theme">
    <link rel="stylesheet" href="node_modules/prismjs/themes/prism-tomorrow.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/motion.css">

    <style>
        .reveal .slides section {
            text-align: left;
        }

        .reveal .slides section.center {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="reveal">
        <div class="slides">
            <section data-markdown="slides.md" data-separator="^\n---\n$" data-separator-vertical="^\n--\n$" data-separator-notes="^Note:">
            </section>
        </div>

        <div id="page-frame" aria-hidden="true">
            <div class="page-header">
                <span class="page-no">page <b class="n">1</b> of <b class="total"></b></span>
                <span class="pointers"></span>
                <span class="section"></span>
            </div>
        </div>
    </div>

    <script>
        window.Prism = window.Prism || {};
        window.Prism.manual = false;
    </script>
    <script src="node_modules/prismjs/prism.js"></script>
    <script src="node_modules/prismjs/components/prism-ruby.js"></script>
    <script src="node_modules/prismjs/components/prism-sql.js"></script>
    <script src="node_modules/prismjs/components/prism-bash.js"></script>
    <script src="node_modules/prismjs/components/prism-yaml.js"></script>

    <script src="node_modules/reveal.js/dist/reveal.js"></script>
    <script src="node_modules/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="node_modules/reveal.js/plugin/notes/notes.js"></script>
    <script src="node_modules/reveal.js/plugin/zoom/zoom.js"></script>

    <script>
        Reveal.initialize({
            hash: true,
            slideNumber: false,
            progress: false,
            transition: 'fade',
            transitionSpeed: 'fast',
            backgroundTransition: 'fade',
            center: false,
            width: 1920,
            height: 1080,
            margin: 0.04,
            markdown: {
                smartypants: false
            },
            plugins: [RevealMarkdown, RevealNotes, RevealZoom]
        });

        Reveal.on('slidechanged', event => {
            updatePageHeader(event.indexh + 1);
        });

        Reveal.on('ready', event => {
            fixCodeBlockClasses();
            updatePageHeader(Reveal.getIndices().h + 1);
            setTimeout(() => {
                fixCodeBlockClasses();
                updatePageHeader(Reveal.getIndices().h + 1);
            }, 250);
        });

        function fixCodeBlockClasses() {
            document.querySelectorAll('pre code').forEach((block) => {
                Array.from(block.classList).forEach(cls => {
                    if (cls && !cls.startsWith('language-') && cls !== 'hljs') {
                        block.classList.remove(cls);
                        block.classList.add(`language-${cls}`);
                    }
                });
                if (window.Prism) {
                    Prism.highlightElement(block);
                }
            });
        }

        // Draws the heap page header: page number, one line pointer per slide,
        // and the current slide's section name taken from its .eyebrow.
        function updatePageHeader(currentSlide) {
            const header = document.querySelector('#page-frame .page-header');
            const totalSlides = Reveal.getTotalSlides();
            const pointers = header.querySelector('.pointers');
            const section = header.querySelector('.section');
            const eyebrow = Reveal.getCurrentSlide().querySelector('.eyebrow');

            header.querySelector('.n').textContent = currentSlide;
            header.querySelector('.total').textContent = totalSlides;

            pointers.replaceChildren(...Array.from({ length: totalSlides }, (_, i) => {
                const tick = document.createElement('i');
                if (i + 1 < currentSlide) tick.className = 'used';
                if (i + 1 === currentSlide) tick.className = 'current';
                return tick;
            }));

            section.textContent = eyebrow ? eyebrow.textContent : '';
            section.classList.toggle('danger', !!eyebrow && eyebrow.classList.contains('warning'));
        }
    </script>
</body>

</html>
